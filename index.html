<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Звіздар</title>
    
    <!-- 1. Базові стилі та шрифти -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="style.css?v=1.1">

    <!-- 2. ОСНОВНА БІБЛІОТЕКА КАРТИ (Повинна бути першою!) -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- 3. Плагіни для Leaflet (залежать від основного скрипта вище) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/OverlappingMarkerSpiderfier-Leaflet/0.2.6/oms.min.js"></script>
    
    <!-- 4. Інші бібліотеки -->
    <script src="https://unpkg.com/@turf/turf@6/turf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div id="sidebar">
        <h2>Звіздар</h2>
        
        <div class="card">
            <label>1. Дані Депо (GAS)</label>
            <!-- Поле вводу видалено, залишаємо тільки кнопку -->
            <button onclick="fetchDepoData()">Завантажити / Оновити Депо</button>
            <div id="depoStatus" class="status">Очікування...</div>
        </div>

        <div class="card">
            <label>2. Дані Відділень (Excel)</label>
            <div class="file-wrapper">
                <input type="file" id="fileInput" accept=".xlsx, .xls">
                <div id="fileName">Обрати файл</div>
            </div>
            
            <!-- Блок вибору аркуша (прихований за замовчуванням) -->
            <div id="sheetSelectionBlock" class="sheet-selection">
                <label style="font-size: 0.65rem;">Оберіть аркуш із даними:</label>
                <div class="popup-row" style="margin-bottom: 0;">
                    <select id="sheetSelect" class="smart-input"></select>
                    <button onclick="processSelectedSheet()" class="popup-btn btn-green">ОК</button>
                </div>
            </div>

            <!-- Посилання на завантаження шаблону -->
            <div style="text-align: right;">
                <a href="template.xlsx" download class="template-link">📥 Завантажити приклад файлу</a>
            </div>

            <div id="pointsStatus" class="status">Очікування...</div>
        </div>

        <div class="card">
            <label>3. Налаштування</label>
            <div class="setting-row">
                <div class="setting-col">
                    <label style="font-size: 0.65rem;">Година (Від):</label>
                    <input type="number" id="hourStart" value="10" min="0" max="23">
                </div>
                <div class="setting-col">
                    <label style="font-size: 0.65rem;">Година (До):</label>
                    <input type="number" id="hourEnd" value="12" min="0" max="23">
                </div>
            </div>
            
            <label style="margin-top: 10px;">Типи вантажу:</label>
            <div class="checkbox-group">
                <label><input type="checkbox" id="chkDV" checked> ДВ</label>
                <label><input type="checkbox" id="chkP" checked> П</label>
                <label><input type="checkbox" id="chkV"> В</label>
            </div>

            <!-- Налаштування для зірочок -->
            <label style="margin-top: 10px; color: var(--accent);">Налаштування звіздочок:</label>
            <div class="setting-row">
                <div class="setting-col">
                    <label style="font-size: 0.65rem;">Мін. площа (кв.м):</label>
                    <input type="number" id="starMinArea" value="150" min="0">
                </div>
                <div class="setting-col">
                    <label style="font-size: 0.65rem;">Макс. звіздочок/Депо:</label>
                    <input type="number" id="starMaxCount" value="15" min="1">
                </div>
                <div class="setting-col">
                    <label style="font-size: 0.65rem;">Відділень/Звіздочку:</label>
                    <input type="number" id="starMaxPoints" value="15" min="1">
                </div>
            </div>

            <button class="primary-btn" onclick="runDistribution()">Розподілити</button>
            <button onclick="exportToExcel()" style="margin-top: 10px; border-color: #4ade80; color: #4ade80;">
                💾 Вивантажити в Excel
            </button>
        </div>
    </div>
    
    <div id="rightColumn">
        <div id="map"></div>
        
        <!-- Общий контейнер для элементов управления в правом верхнем углу -->
        <div class="top-right-controls">
            <!-- Новое поле поиска отделения -->
            <div class="map-search-container">
                <input type="text" id="pointSearchInput" class="smart-input" placeholder="Пошук відділення (від 3 симв.)..." oninput="handleSearchInput(this.value)">
                <div id="pointSearchResults" class="map-search-results" style="display: none;"></div>
            </div>

            <!-- Существующий фильтр депо -->
            <div id="mapFilterContainer" class="map-filter-container">
                <input type="text" id="mapFilterInput" class="smart-input" readonly placeholder="Усі депо (натисніть для вибору)" onclick="toggleFilterMenu()">
                <div id="mapFilterMenu" class="map-filter-menu" style="display: none;">
                    <!-- Чекбокси згенеруються тут -->
                </div>
            </div>
        </div>
        
        <img src="logo3.png" alt="Logo" class="map-floating-logo">
    </div>

    <div id="chartModal" class="chart-modal-overlay" onclick="if(event.target === this) closeChartModal()">
        <div class="chart-modal-box">
            <div class="chart-header">
                <h3 id="chartDepotTitle">Навантаження</h3>
                <span class="close-btn" onclick="closeChartModal()">✖</span>
            </div>
            <!-- Вкладки графіка -->
            <div class="chart-tabs">
                <button class="tab-btn active" data-tab="all" onclick="switchChartTab('all')">Загальна</button>
                <button class="tab-btn" data-tab="dv" onclick="switchChartTab('dv')">ДВ</button>
                <button class="tab-btn" data-tab="p" onclick="switchChartTab('p')">П</button>
                <button class="tab-btn" data-tab="v" onclick="switchChartTab('v')">В</button>
            </div>
            <div class="chart-container">
                <canvas id="depotChart"></canvas>
            </div>
        </div>
    </div>
    <!-- Модалка масового перенесення -->
    <div id="massMoveModal" class="chart-modal-overlay" onclick="if(event.target === this) closeMassMoveModal()">
        <div class="chart-modal-box" style="max-width: 400px; text-align: center;">
            <div class="chart-header">
                <h3>Масове перенесення</h3>
                <span class="close-btn" onclick="closeMassMoveModal()">✖</span>
            </div>
            <p style="color: var(--text-main); margin-bottom: 15px;">
                Вибрано відділень: <b id="massMoveCount" style="color: var(--accent);">0</b>
            </p>
            <label style="text-align: left;">Оберіть нове Депо:</label>
            <input list="mass-depo-list" id="massMoveDepoInput" class="smart-input" placeholder="Пошук депо...">
            <datalist id="mass-depo-list"></datalist>
            
            <button class="primary-btn" onclick="applyMassMove()" style="margin-top: 20px;">ПЕРЕНЕСТИ</button>
        </div>
    </div>
    <script src="script.js?v=1.1"></script>
</body>
</html>
